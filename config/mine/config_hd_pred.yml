  NK_cells: [BMMC22_NK, PBMC_25_NK, BMMC22_ILC]
  Monocytes: [BMMC22_CD14_pos_Mono, BMMC22_CD16_pos_Mono, PBMC_11_CD14.Mono.1, PBMC_12_CD14.Mono.2, PBMC_13_CD16.Mono]
  Dendritic_cells: [BMMC22_cDC2, BMMC22_pDC, PBMC_10_cDC]
  Erythroid_cells: [BMMC22_Erythroblast, BMMC22_Normoblast, BMMC22_Proerythroblast]   

