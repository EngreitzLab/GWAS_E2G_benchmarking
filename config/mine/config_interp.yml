
##  CONFIG
results: "results/2024_0213_scE2G_for_interpretation"
methodsTable: "config/mine/config_methods.tsv"
predictionsTable: "config/mine/config_predictions_hd_scE2G.tsv" # file paths for predictions; column for biosample and each method
methods: [scE2G_multiome, scE2G_ATAC, scABC, Kendall, ABC_distanceToTSS]
comparisonsTable: "config/mine/config_comparisons_hd_blood.tsv" # comparisons to compute and plot; columns: name, biosample[group], trait[group]

# groups of biosamples and traits to combine
biosampleGroups: # will be computed for any predictors with all biosamples represented (in addition to ALL; must be distinct from biosample names)
  T_cells: [BMMC22_CD4_pos_T_activated, BMMC22_CD4_pos_T_naive, BMMC22_CD8_pos_T, BMMC22_CD8_pos_T_naive, PBMC_20_CD4.N1, PBMC_22_CD4.M, PBMC_24_CD8.CM]
  B_cells: [BMMC22_B1_B, BMMC22_Naive_CD20_pos_B, BMMC22_Transitional_B, PBMC_17_B, BMMC22_Plasma_cell]
  NK_cells: [BMMC22_NK, PBMC_25_NK, BMMC22_ILC]
  Monocytes: [BMMC22_CD14_pos_Mono, BMMC22_CD16_pos_Mono, PBMC_11_CD14.Mono.1, PBMC_12_CD14.Mono.2, PBMC_13_CD16.Mono]
  Dendritic_cells: [BMMC22_cDC2, BMMC22_pDC, PBMC_10_cDC]
  Erythroid_cells: [BMMC22_Erythroblast, BMMC22_Normoblast, BMMC22_Proerythroblast]
  Progenitors: [BMMC22_G_M_prog, BMMC22_HSC, BMMC22_Lymph_prog, BMMC22_MK_E_prog]
  Pancreatic_islets: [Islets_alpha, Islets_beta, Islets_delta, Islets_immune, Islets_PP, Islets_acinar, Islets_mesenchymal, Islets_duct, Islets_endothelial]

traitGroups: # for benchmarking against groups of traits with potentially shared variants, in addition to ALL; must be distinct from trait names
  RBC_traits: [RBC, MCH, MCHC, MCV, Hb, HbA1c, Ht, Plt]
  WBC_traits: [WBC,Mono,Lym,Eosino,AID_Combined, IBD, CRP]
  Blood_counts: [RBC, WBC, Mono, Lym, Eosino, Baso, Neutro, Plt]

